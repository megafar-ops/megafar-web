backend:
  name: github
  repo: megafar-ops/megafar-web
  branch: main
  base_url: https://megafar-web.vercel.app
  auth_endpoint: api/auth

# Vercel'de "Preview Deployments" acmak istersen ileride buraya
# open_authoring / squash_merges gibi ayarlar eklenebilir. Simdilik
# minimal, tek dal (main) uzerinden dogrudan commit akisi kullaniliyor.

media_folder: "assets/products"
public_folder: "/assets/products"

locale: "tr"

collections:
  - name: "products"
    label: "Ürünler"
    label_singular: "Ürün"
    files:
      - name: "products"
        label: "Ürün Kataloğu"
        file: "data/products.json"
        fields:
          - label: "Ürünler"
            name: "products"
            widget: "list"
            summary: "{{fields.code}} — {{fields.name_tr}}"
            fields:
              - { label: "ID (benzersiz slug)", name: "id", widget: "string", hint: "Orn. mf-lf-001" }
              - { label: "Ürün Kodu", name: "code", widget: "string" }
              - { label: "Ad (TR)", name: "name_tr", widget: "string" }
              - { label: "Ad (EN)", name: "name_en", widget: "string" }
              - { label: "Ad (AR)", name: "name_ar", widget: "string" }
              - { label: "Açıklama (TR)", name: "desc_tr", widget: "text", required: false }
              - { label: "Açıklama (EN)", name: "desc_en", widget: "text", required: false }
              - { label: "Açıklama (AR)", name: "desc_ar", widget: "text", required: false }
              - { label: "Fiyat", name: "price", widget: "number", value_type: "float" }
              - label: "Para Birimi"
                name: "currency"
                widget: "select"
                options: ["TRY", "USD", "EUR"]
                default: "TRY"
              - label: "Vurgu Rengi"
                name: "accent"
                widget: "select"
                options: ["red", "amber", "white"]
                default: "white"
                required: false
              - { label: "Yeni Ürün Rozeti", name: "is_new", widget: "boolean", default: false }
              - { label: "Ön Görsel", name: "front_image", widget: "image" }
              - label: "Arka Görseller"
                name: "back_images"
                widget: "list"
                field: { label: "Görsel", name: "image", widget: "image" }
              - { label: "Video (opsiyonel)", name: "video", widget: "file", required: false }
              - label: "Sıralama"
                name: "sort_order"
                widget: "number"
                value_type: "int"
                default: 0
                hint: "Küçük sayı önce gösterilir."
